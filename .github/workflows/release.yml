name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:unit

      - run: pnpm test:e2e

      - name: Build binaries
        run: |
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            # Not plain bun-*-x64: on an AVX2 runner it resolves to the modern
            # build, which dies with SIGILL on x64 CPUs without AVX2.
            case "$target" in
              *-x64) bun_target="bun-${target}-baseline" ;;
              *)     bun_target="bun-${target}" ;;
            esac
            bun build --compile --target="$bun_target" src/cli.ts --outfile "release/lsec-${target}"
          done

      - name: Run e2e suite against the linux-x64 binary
        run: LSEC_E2E_CLI="$PWD/release/lsec-linux-x64" pnpm test:e2e

      - name: Checksums
        run: |
          cd release
          sha256sum lsec-* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
