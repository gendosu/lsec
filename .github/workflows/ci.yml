name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:unit

      - run: pnpm test:e2e

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:bin

      - name: Smoke test
        run: |
          export LOCAL_SECRET_CONFIG_DIR="$RUNNER_TEMP/lsec-smoke"
          printf 'smoke-value' | ./bin/lsec set smoke --stdin
          test "$(./bin/lsec get smoke)" = "smoke-value"
          MY_SECRET="lsec://global/smoke" ./bin/lsec run -- sh -c 'test "$MY_SECRET" = "smoke-value"'
